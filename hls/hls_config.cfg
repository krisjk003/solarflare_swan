# ============================================================================
# CustomCNN1D INT8 — Vitis 2026.1 HLS Component Configuration
#
# This is the modern config-driven flow for Vitis Unified IDE 2026.1.
# It replaces the legacy 'vitis_hls -f build_hls.tcl' invocation.
#
# USAGE (from project root):
#
#   source /opt/Xilinx/2026.1/Vitis/settings64.sh
#
#   C Simulation:
#     vitis-run --mode hls --csim --config hls/hls_config.cfg --work_dir cnn_hls_project
#
#   C Synthesis:
#     v++ -c --mode hls --config hls/hls_config.cfg --work_dir cnn_hls_project
#
#   Co-Simulation:
#     vitis-run --mode hls --cosim --config hls/hls_config.cfg --work_dir cnn_hls_project
#
#   Package IP for Vivado:
#     vitis-run --mode hls --package --config hls/hls_config.cfg --work_dir cnn_hls_project
#
#   Implementation (Vivado out-of-context):
#     vitis-run --mode hls --impl --config hls/hls_config.cfg --work_dir cnn_hls_project
#
# Alternatively, the legacy TCL flow is still supported via:
#   vitis-run --mode hls --tcl hls/build_hls.tcl
#
# ============================================================================

# Target FPGA: EBAZ4205 board — Zynq-7000 XC7Z010CLG400-1
part=xc7z010clg400-1

[hls]
# Top-level synthesizable function
syn.top=cnn_forward

# Source files (paths relative to project root)
syn.file=cnn_hw.cpp

# Testbench files
tb.file=cnn_tb.cpp

# Clock period: 10 ns = 100 MHz
clock=10ns
